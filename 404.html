<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>

<style>

  .box{max-width:520px;width:100%}
  .bar{display:flex;height:3px;margin-bottom:2rem}

  .k{font:600 11px/1 Saira,sans-serif;letter-spacing:.28em;color:#8b8b8b;text-transform:uppercase}
  h1{font-size:clamp(3rem,10vw,6rem);line-height:.9;margin:.6rem 0 1rem;letter-spacing:-.02em}
  h1 span{color:transparent;-webkit-text-stroke:1.5px #EDEDED}
  p{color:#a9a9a9;line-height:1.8;font-size:.95rem}
  a{display:inline-block;margin-top:1.6rem;padding:.9em 1.4em;background:#FFFA00;color:#161616;font:700 12px/1 Saira,sans-serif;letter-spacing:.18em;text-decoration:none}
</style>
</head>
<body>
  <main class="box">
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="k">// 404 / LOST SIGNAL</p>
    <h1>走丢了<span>。</span></h1>
    <p>这个地址不在站点里。回到首页，或者直接翻到你要看的章节。</p>
